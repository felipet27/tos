<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de fondo blanco perla / cristal -->
    <linearGradient id="bgCristal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Gradiente Azul Eléctrico y Cian -->
    <linearGradient id="cianGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Gradiente Azul Zafiro Profundo -->
    <linearGradient id="zafiroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F2B59"/>
    </linearGradient>

    <!-- Resplandor cian futurista -->
    <filter id="glowCian" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#06B6D4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base cristal con bisel cian -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgCristal)" stroke="url(#cianGrad)" stroke-width="2.5"/>

  <!-- Brillo de vidrio en esquina superior -->
  <path d="M 6 18 Q 18 6 36 6 Q 16 16 6 18 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Prisma / Nodo de datos cibernético -->
  <circle cx="48" cy="16" r="3" fill="#06B6D4" filter="url(#glowCian)"/>
  <circle cx="48" cy="16" r="1.2" fill="#FFFFFF"/>

  <!-- Monograma Cristal "2F" -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="-1">
    <!-- El '2' en zafiro de laboratorio -->
    <text x="12" y="44" fill="url(#zafiroGrad)">2</text>
    <!-- La 'F' en cian eléctrico de alta tecnología -->
    <text x="29" y="44" fill="url(#cianGrad)" filter="url(#glowCian)">F</text>
  </g>

  <!-- Barra de pulso cuántico inferior -->
  <rect x="14" y="49" width="36" height="2" rx="1" fill="#CBD5E1" opacity="0.8"/>
  <rect x="14" y="49" width="22" height="2" rx="1" fill="#06B6D4" opacity="0.95"/>
</svg>
