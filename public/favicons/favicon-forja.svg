<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente de fondo obsidiana -->
    <radialGradient id="bgForja" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181B26"/>
      <stop offset="70%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Gradiente Cobre Steampunk -->
    <linearGradient id="cobreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="35%" stop-color="#E5A93C"/>
      <stop offset="70%" stop-color="#B87333"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Resplandor verde fósforo -->
    <filter id="glowFosforo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#22C55E" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base obsidiana con bisel -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgForja)" stroke="url(#cobreGrad)" stroke-width="2.5"/>

  <!-- Remaches / detalles mecánicos en esquinas -->
  <circle cx="10" cy="10" r="1.5" fill="#E5A93C" opacity="0.8"/>
  <circle cx="54" cy="10" r="1.5" fill="#E5A93C" opacity="0.8"/>
  <circle cx="10" cy="54" r="1.5" fill="#E5A93C" opacity="0.8"/>
  <circle cx="54" cy="54" r="1.5" fill="#E5A93C" opacity="0.8"/>

  <!-- Indicador LED de fósforo verde (reloj/taller) -->
  <circle cx="48" cy="16" r="3" fill="#22C55E" filter="url(#glowFosforo)"/>
  <circle cx="48" cy="16" r="1.2" fill="#FFFFFF"/>

  <!-- Monograma Forja "2F" -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="-1">
    <!-- El '2' en cobre industrial -->
    <text x="12" y="44" fill="url(#cobreGrad)">2</text>
    <!-- La 'F' en fósforo verde brillante -->
    <text x="29" y="44" fill="#22C55E" filter="url(#glowFosforo)">F</text>
  </g>

  <!-- Barra de estado industrial inferior -->
  <rect x="14" y="49" width="36" height="2" rx="1" fill="#B87333" opacity="0.6"/>
  <rect x="14" y="49" width="18" height="2" rx="1" fill="#22C55E" opacity="0.9"/>
</svg>
